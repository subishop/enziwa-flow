<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENZIWA flow test</title>
<style>
:root{
  --blue:#116B9E; --cream:#F2EACF; --flame:#FF5A1F; --ink:#1d2a33; --grey:#8f8f8f;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);overflow-x:clip}
#track{position:relative;width:100%}
#stage{position:sticky;top:0;height:100vh;height:100svh;width:100%;overflow:hidden;background:var(--cream)}

/* opening */
#hero{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:6}
/* hero bottle: the same see-through Blender frame the page uses, placed exactly where the scroll bottle sits, so the logo shows behind the glass */
#hero img{position:absolute;height:69.6svh;width:auto;left:50%;top:-3.25svh;transform:translateX(-50%)}
/* the wordmark runs almost edge to edge across the top, sitting behind the bottle */
#hero .word{position:absolute;top:3svh;left:2vw;right:2vw;margin:0;color:var(--blue);z-index:0}
#hero .word svg{display:block;width:100%;height:auto}
#hero img{z-index:1}
#hero .sub{position:absolute;bottom:9svh;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.35em;color:var(--blue);text-transform:uppercase}
#hero .sub b{display:block;font-weight:400;margin-top:10px;color:var(--flame);letter-spacing:.2em}

/* composite layer: previous scene (or cream before the first spray), the new scene revealed through the mist,
   the Blender bottle (multiply for tint and shadow, screen for highlights), the white mist on top */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* panel */
#panel{position:absolute;left:50%;bottom:0;z-index:5;width:min(980px,94vw);opacity:0;pointer-events:none;
  transform:translate(-50%,100%);background:rgba(255,250,240,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(29,42,51,.10);
  padding:26px 34px 84px;display:grid;grid-template-columns:1fr 1.15fr;column-gap:40px;align-items:start}
#panel.on{pointer-events:auto}
.num{font-size:12px;letter-spacing:.3em;color:var(--blue);text-transform:uppercase}
.name{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.4svh,46px);color:var(--blue);line-height:1.05;margin-top:8px}
.desc{font-size:14.5px;line-height:1.6;color:var(--ink);margin-top:12px}
.order{margin-top:14px;font:500 12px var(--sans);letter-spacing:.25em;text-transform:uppercase;padding:12px 26px;
  border-radius:999px;border:1px solid var(--blue);background:var(--blue);color:var(--cream);cursor:pointer}
.order:hover{background:var(--flame);border-color:var(--flame)}
#groups{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:4px;grid-column:2;grid-row:1 / span 2}
.grp h5{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--blue);font-weight:500;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:7px;width:100%;border:0;background:rgba(242,234,207,.9);border-radius:999px;
  padding:5px 10px 5px 5px;margin-bottom:6px;font:13px var(--sans);color:var(--ink);cursor:pointer;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{flex:0 0 15px;height:15px;border-radius:50%}
.chip:hover{background:#fff}
.chip:focus-visible,.order:focus-visible{outline:2px solid var(--flame);outline-offset:3px}

/* card */
#card{position:fixed;z-index:20;width:240px;background:#fffaf0;border-radius:14px;padding:18px 18px 16px;
  box-shadow:0 18px 40px rgba(17,107,158,.18);display:none}
#card.show{display:block}
#card h4{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--blue)}
#card .tier{font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-top:4px}
#card p{font-size:13px;line-height:1.5;margin-top:10px;color:#4c5862}
#card button{position:absolute;top:10px;right:12px;background:none;border:0;font-size:20px;color:#7a858e;cursor:pointer}
#scrim{display:none}

/* pill */
#pill{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(17,107,158,.94);
  color:var(--cream);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);white-space:nowrap}
#pill .cur{padding:0 12px 0 10px;font-family:var(--serif);font-size:15px;min-width:128px;text-align:center}
#pill button{border:0;background:transparent;color:var(--cream);font:500 12px var(--sans);width:34px;height:30px;border-radius:999px;cursor:pointer;letter-spacing:.05em}
#pill button.active{background:var(--cream);color:var(--blue)}

/* mobile */
@media (max-width:700px){
  #hero img{height:49.7svh;top:-2.2svh}
  #panel{width:100%;grid-template-columns:1fr;padding:16px 16px 72px;border-radius:20px 20px 0 0}
  .num{font-size:10px}
  .name{font-size:28px;margin-top:4px}
  .desc{font-size:13px;line-height:1.45;margin-top:8px}
  .order{margin-top:8px;padding:9px 20px;font-size:11px}
  #groups{gap:6px;margin-top:10px;grid-column:1;grid-row:2}
  #panel .pdesc{grid-row:3}
  .grp h5{margin-bottom:5px;text-align:center}
  .chip{font-size:12px;padding:4px 8px 4px 4px;margin-bottom:4px;gap:6px}
  .chip i{flex-basis:13px;height:13px}
  #card{position:fixed;left:0;right:0;bottom:0;width:auto;z-index:40;border-radius:18px 18px 0 0;padding:22px 22px 34px;
    transform:translateY(100%);transition:transform .35s ease;display:block;visibility:hidden}
  #card.show{transform:translateY(0);visibility:visible}
  #scrim{display:block;position:fixed;inset:0;background:rgba(29,42,51,.18);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
  #scrim.show{opacity:1;pointer-events:auto}
  #pill .cur{min-width:100px;font-size:14px;padding:0 8px}
}
@media (prefers-reduced-motion:reduce){
  #card{transition:none !important}
}
</style>
</head>

function pad(n,k){return ("000"+n).slice(-k)}
function imgs(pre,n,k,ext){var a=[];for(var j=0;j<n;j++){var im=new Image();im.decoding="async";im.src="img/spray3/"+pre+pad(j,k)+ext;a.push(im)}return a}

function ok(im){return im && im.complete && im.naturalWidth>0}
function pick(arr,j){if(!arr.length) return null; j=Math.max(0,Math.min(arr.length-1,j)); while(j>=0 && !ok(arr[j])) j--; return j<0?null:arr[j]}

  [M,SS].forEach(function(c){c.width=W;c.height=H});
  FZ.width=fx.width; FZ.height=fx.height;
  var mob=mq.matches, base=H*(mob?0.43:0.60), capT=H*(mob?0.03:0.04);
  var s=(base-capT)/(SQ.base-SQ.capTop);

}

// placeholder scenes: rich gradient, soft glow behind the bottle, the two grey silhouettes
var MAN=["M22 66 Q60 54 98 66 L104 170 Q96 176 90 170 L86 110 L84 176 L34 176 L34 110 L30 170 Q24 176 16 170 Z","M36 174 L58 174 L56 296 L40 296 Z","M62 174 L84 174 L80 296 L64 296 Z"];
var WOMAN=["M60 10 Q86 12 84 46 Q82 70 88 82 Q60 74 32 82 Q38 70 36 46 Q34 12 60 10 Z","M34 66 Q60 58 86 66 L94 150 Q88 156 82 150 L78 104 L106 232 L14 232 L42 104 L38 150 Q32 156 26 150 Z","M44 230 L56 230 L54 296 L44 296 Z","M64 230 L76 230 L76 296 L66 296 Z"];
function buildScene(j){
  if(PHOTO[j] && PHOTO[j].complete && PHOTO[j].naturalWidth){   // photographic scene: cover the stage, keep the centre
    var pi=PHOTO[j], cv0=SC[j]; cv0.width=W; cv0.height=H; var c0=cv0.getContext("2d");
    var sc0=Math.max(W/pi.naturalWidth,H/pi.naturalHeight), dw=pi.naturalWidth*sc0, dh=pi.naturalHeight*sc0;
    c0.drawImage(pi,(W-dw)/2,(H-dh)/2,dw,dh); return;
  }
  var b=BL[j], cv=SC[j]; cv.width=W; cv.height=H; var c=cv.getContext("2d");
  var g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,b.sc[0]); g.addColorStop(.55,b.sc[1]); g.addColorStop(1,b.sc[2]);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  var r=c.createRadialGradient(W/2,H*0.36,0,W/2,H*0.36,Math.max(W,H)*0.55);
  r.addColorStop(0,"rgba(255,236,205,.38)"); r.addColorStop(1,"rgba(255,236,205,0)");
  c.fillStyle=r; c.fillRect(0,0,W,H);
  var mob=W<H, ph=H*(mob?0.42:0.6), sc=ph/300, foot=H*(mob?0.70:0.97);
  var xs=mob?[W*0.07,W*0.93]:[Math.max(W,H*16/9)*0.32+(W-Math.max(W,H*16/9))/2, Math.max(W,H*16/9)*0.68+(W-Math.max(W,H*16/9))/2];
  function person(paths,x,col,r0){
    c.save(); c.translate(x-60*sc, foot-300*sc); c.scale(sc,sc); c.fillStyle=col;
    c.beginPath(); c.arc(60,30,r0,0,6.2832); c.fill();
    paths.forEach(function(d){c.fill(new Path2D(d))}); c.restore();
  }
  person(MAN,xs[0],"rgba(150,150,150,.62)",22); person(WOMAN,xs[1],"rgba(165,165,165,.62)",20);
}

var shown=-1;
function build(i){
  var b=BL[i]; shown=i; ensure(i); ensure(i+1);
  $("num").textContent="No. "+b.n; $("name").textContent=b.name; $("desc").textContent=b.desc;
  groups.innerHTML="";
  TIERS.forEach(function(t,ti){
    var g=document.createElement("div"); g.className="grp"; g.innerHTML="<h5>"+TL[t]+"</h5>"; groups.appendChild(g);
    b[t].forEach(function(nm){
      var c=document.createElement("button"); c.type="button"; c.className="chip"; c.innerHTML="<i style='background:"+b.col[ti]+"'></i>"+nm;
      c.onclick=function(e){openCard(nm,t,c,e)}; g.appendChild(c);
    });
  });
  closeCard(); key="";
  pillCur.textContent=b.name;
  pillBtns.forEach(function(x,j){x.classList.toggle("active",j===i)});
}

// card
function openCard(nm,t,el,e){
  e.stopPropagation();
  $("cName").textContent=nm; $("cTier").textContent=TL[t]+" note"; $("cTier").style.color=BL[shown].col[TIERS.indexOf(t)];
  card.classList.add("show");
  if(!mq.matches){
    var r=el.getBoundingClientRect();
    var x=Math.max(12,Math.min(r.left,W-252)), y=r.top-card.offsetHeight-10;
    if(y<12) y=r.bottom+10;
    card.style.left=x+"px"; card.style.top=y+"px";
  } else { card.style.left=""; card.style.top=""; scrim.classList.add("show"); }
}
function closeCard(){ card.classList.remove("show"); scrim.classList.remove("show"); }
$("cardX").onclick=closeCard; scrim.onclick=closeCard;
card.onclick=function(e){e.stopPropagation()};
document.addEventListener("click",closeCard);

// helpers
function cl(x){return x<0?0:x>1?1:x}
function rng(t,a,b){return cl((t-a)/(b-a))}
function ease(x){return x*x*(3-2*x)}
function toward(v,goal,maxStep){return v<goal?Math.min(goal,v+maxStep):Math.max(goal,v-maxStep)}

// scroll
var cur=window.scrollY/H||0, tgt=cur, jumpTo=null;
function onScroll(){tgt=window.scrollY/H}
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",function(){size();onScroll()});
mq.addEventListener && mq.addEventListener("change",function(){closeCard()});

// the pill lands in that blend's revealed scene: blends passed on the way count as already sprayed
pillBtns.forEach(function(btn){btn.onclick=function(e){e.stopPropagation();
  var i=+btn.dataset.i; jumpTo=START+SEG*i+SEG*0.8;
  window.scrollTo({top:jumpTo*H,behavior:RM?"auto":"smooth"});}});

// spray event state, per blend: idle, play, done, fade
var sp={i:-1,state:"idle",p:0,fade:0};
var capShown=0, liftShown=0, outShown=0, panelGate=0, lastTime=0, lastI=-2, key="";
function setDone(){ sp.state="done"; sp.p=1; capShown=1; liftShown=1; panelGate=1; }

// drawing
function frameRect(e){ // frame rect in stage px, scaled by e around the nozzle
  var w=SQ.w*L.s, h=SQ.h*L.s, px=L.x+SQ.cx*L.s, py=L.y+L.lift+SQ.nozY*L.s;
  return [px-(px-L.x)*e, py-(py-(L.y+L.lift))*e, w*e, h*e];
}
function drawBottle(set,j,alpha){ // soft contact shadow, then the see-through bottle frame drawn normally
  var b=pick(set,j), r=frameRect(1);
  if(!b||alpha<=0.001) return;
  fc.globalAlpha=alpha;
  var hv=BL[shown]&&BL[shown].hover, cx=L.x+SQ.cx*L.s, cy=L.y+L.lift+(SQ.base-2)*L.s+(hv?H*0.12:0), rw=(hv?150:110)*L.s;
  fc.save(); fc.translate(cx,cy); fc.scale(1,0.16);
  var g=fc.createRadialGradient(0,0,0,0,0,rw); g.addColorStop(0,hv?"rgba(40,30,10,.22)":"rgba(0,0,0,.30)"); g.addColorStop(1,"rgba(0,0,0,0)");
  fc.fillStyle=g; fc.beginPath(); fc.arc(0,0,rw,0,6.2832); fc.fill(); fc.restore();
  fc.drawImage(b,r[0],r[1],r[2],r[3]);
  fc.globalAlpha=1;
}
var MIST_MAX=0.8;   // overall strength of the white mist: a veil over the colour, not a sheet
function grow(p){return 1+1.6*ease(rng(p,0.45,0.85))}   // the reveal finishes a little sooner now the mist leaves earlier
function fill(p){return ease(rng(p,0.55,0.85))}
function drawBase(i){ if(i>0) fc.drawImage(SC[i-1],0,0,W,H); else { fc.fillStyle=CREAM; fc.fillRect(0,0,W,H); } }
function drawReveal(i,p){
  var mi=pick(MASK[i],Math.round(p*(SQ.mask-1))); if(!mi) return;
  var E=grow(p), g=fill(p), r=frameRect(MS), re=frameRect(E*MS);
  mc.clearRect(0,0,W,H);
  // masks carry half a clip height of soft margin above and below, so the reveal feathers past the clip edge
  mc.drawImage(mi,r[0],r[1]-r[3]*0.5,r[2],r[3]*2);
  if(E>1.001) mc.drawImage(mi,re[0],re[1]-re[3]*0.5,re[2],re[3]*2);
  if(g>0){ mc.fillStyle="rgba(0,0,0,"+g+")"; mc.fillRect(0,0,W,H); }
  ssx.globalCompositeOperation="copy"; ssx.drawImage(SC[i],0,0);
  ssx.globalCompositeOperation="destination-in"; ssx.drawImage(M,0,0);
  ssx.globalCompositeOperation="source-over";
  fc.drawImage(SS,0,0,W,H);
}
function drawMistLayer(i,p){
  var wi=pick(MIST[i],Math.round(p*(SQ.mist-1))); if(!wi) return;
  // full only through the soft rolling cloud; as the clip breaks into thin streaks (about 40% in) the mist fades to a faint veil, then away
  var r=frameRect(MS), a=MIST_MAX*(1-0.8*ease(rng(p,0.38,0.58)))*(1-ease(rng(p,0.58,0.80)));
  if(a<=0.001) return;
  fc.globalCompositeOperation="screen"; fc.globalAlpha=a;   // white mist filmed on black: screen lays it over any colour
  fc.drawImage(wi,r[0],r[1],r[2],r[3]);
  fc.globalCompositeOperation="source-over"; fc.globalAlpha=1;
}

function frame(time){
  var dt=lastTime?Math.min(0.1,(time-lastTime)/1000):0; lastTime=time;
  cur = RM ? tgt : cur+(tgt-cur)*0.12;
  if(Math.abs(tgt-cur)<0.0005) cur=tgt;
  var p=cur;
  if(jumpTo!==null && Math.abs(window.scrollY/H-jumpTo)<0.01 && Math.abs(cur-tgt)<0.01) jumpTo=null;

  // opening
  var h=1-ease(rng(p,0.35,0.95));
  hero.style.opacity=h; hero.style.visibility=h<=0.001?"hidden":"visible";
  hero.style.transform="translateY("+(-(1-h)*6)+"svh)";

  var i=Math.max(0,Math.min(BL.length-1,Math.floor((p-START)/SEG)));
  var t=(p-START-SEG*i)/SEG; if(p<START) t=(p-START)/SEG; // negative before blend one
  if(i!==shown) build(i);
  if(p<0.5){pillCur.textContent="ENZIWA";pillBtns.forEach(function(x){x.classList.remove("active")});lastI=-1}
  else if(lastI!==i){pillCur.textContent=BL[i].name;pillBtns.forEach(function(x,j){x.classList.toggle("active",j===i)});lastI=i}

  // spray event: forward only, in real time
  if(sp.i!==i){
    sp={i:i,state:"idle",p:0,fade:0}; capShown=0; liftShown=0; outShown=0; panelGate=0;
    if(t>T.cap1) setDone();      // coming back up from the next blend: already revealed, no replay
  }
  if(jumpTo!==null && t>=T.press && sp.state!=="done") setDone();
  var past=t>=T.press;
  if(past && (sp.state==="idle"||sp.state==="fade")){ sp.state="play"; sp.p=0; }
  if(!past && (sp.state==="play"||sp.state==="done")){
    sp.state="fade"; sp.fade=1; fzx.drawImage(fx,0,0);   // freeze what is on screen and fade it in place
  }
  if(sp.state==="play"){
    sp.p+=RM?1:dt/SPRAY_S*(t>=T.cap0?FAST:1);
    if(window.__freezeP!=null) sp.p=window.__freezeP;   // test hook: hold the spray at a set point
    if(sp.p>=1){ sp.p=1; sp.state="done"; }
  } else if(sp.state==="fade"){
    sp.fade-=dt/FADE_S; if(sp.fade<=0){ sp.fade=0; sp.state="idle"; sp.p=0; }
  }

  // bottle: spin in by scroll, cap lift by scroll (held up while spraying or fading back),
  // cap back on and spin out by scroll but only once the spray has finished
  var liftGoal=(sp.state!=="idle")?1:rng(t,T.ho1,T.press);
  liftShown = RM ? liftGoal : toward(liftShown,liftGoal,dt/0.4);
  var capGoal=sp.state==="done"?ease(rng(t,T.cap0,T.cap1)):0;
  capShown = RM ? capGoal : toward(capShown,capGoal,dt/0.6);
  var outGoal=capShown>=0.999?rng(t,T.out0,1):0;
  outShown = RM ? outGoal : toward(outShown,outGoal,dt/0.5);
  panelGate = RM ? (capShown>=0.999?1:0) : toward(panelGate,capShown>=0.999?1:0,dt/0.35);
  var bottleA = i===0 ? ease(rng(t,0,0.05)) : 1;

  // panel, and on mobile lift the bottle if the panel would cover it
  var pa=ease(rng(t,T.panel0,T.panel1))*panelGate*(1-ease(rng(t,T.pout0,T.pout1)));
  var bottleBase=L.y+SQ.base*L.s+14, ptop=H-panel.offsetHeight;
  L.lift=Math.min(0,ptop-12-bottleBase)*pa;
  panel.style.opacity=pa; panel.classList.toggle("on",pa>0.6);
  panel.style.transform="translate(-50%,"+((1-pa)*100)+"%)";
  if(card.classList.contains("show") && pa<0.6) closeCard();

  // composite
  var k=[i,sp.state,Math.round(sp.p*600),Math.round(sp.fade*60),Math.round(t*3000),Math.round(capShown*100),Math.round(liftShown*100),Math.round(outShown*100),Math.round(L.lift),W,H].join("|");
  if(k!==key){ key=k;
    fc.setTransform(dpr,0,0,dpr,0,0); fc.globalAlpha=1; fc.globalCompositeOperation="source-over";
    var set, j;
    if(t<T.spin1){ set=SPIN; j=Math.round(rng(t,0,T.spin1)*(SQ.spin-1)); }
    else if(sp.state==="done" && outShown>0){ set=OUTS; j=Math.round(outShown*(SQ.out-1)); }
    else if(sp.state==="done" && capShown>0){ set=DOWN; j=Math.round(capShown*(SQ.down-1)); }
    else { set=LIFT; j=Math.round(liftShown*(SQ.lift-1)); }
    if(sp.state==="fade"){
      drawBase(i); drawBottle(set,j,bottleA);
      fc.setTransform(1,0,0,1,0,0); fc.globalAlpha=sp.fade; fc.drawImage(FZ,0,0); fc.globalAlpha=1;
    } else if(sp.state==="play"){
      drawBase(i); drawReveal(i,sp.p); drawBottle(set,j,1); drawMistLayer(i,sp.p);
    } else if(sp.state==="done"){
      fc.drawImage(SC[i],0,0,W,H); drawBottle(set,j,1);
    } else {
      drawBase(i); drawBottle(set,j,bottleA);
    }
  }

  requestAnimationFrame(frame);
}
size(); onScroll(); cur=tgt; build(0); requestAnimationFrame(frame);
window.__setScroll=function(v){window.scrollTo(0,v*H);tgt=cur=v};
window.__spray=function(){return {i:sp.i,state:sp.state,p:+sp.p.toFixed(2),cap:+capShown.toFixed(2),out:+outShown.toFixed(2)}};
})();

</script>
</body>
