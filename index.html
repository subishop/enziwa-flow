<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENZIWA flow test</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#116B9E; --cream:#F2EACF; --flame:#FF5A1F; --ink:#1d2a33; --grey:#8f8f8f;
  /* titles and sub-levels: Jost, the bottle label's font (TJ chose Jost Light + Jost, 15 Nov); body text stays the system sans */
  --serif: "Jost",system-ui,sans-serif; --label:"Jost",system-ui,sans-serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);overflow-x:clip}
#track{position:relative;width:100%}
#stage{position:sticky;top:0;height:100vh;height:100svh;width:100%;overflow:hidden;background:var(--cream)}

/* opening */
#hero{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:6}
/* hero bottle: the same see-through Blender frame the page uses, placed exactly where the scroll bottle sits, so the logo shows behind the glass */
#hero img{position:absolute;height:69.6svh;width:auto;left:50%;top:-3.25svh;transform:translateX(-50%)}
/* the wordmark runs almost edge to edge across the top, sitting behind the bottle */
/* nudged right: the heavy E stem pulls the visual weight left, so the box sits about 2.5 percent right of centre to balance it */
#hero .word{position:absolute;top:3svh;left:5vw;right:0.4vw;margin:0;color:var(--blue);z-index:0}
#hero .word svg{display:block;width:100%;height:auto}
#hero img{z-index:1}
#hero .sub{position:absolute;bottom:9svh;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.35em;color:var(--blue);text-transform:uppercase}
#hero .sub b{display:block;font-weight:400;margin-top:10px;color:var(--flame);letter-spacing:.2em}

/* composite layer: previous scene (or cream before the first spray), the new scene revealed through the mist,
   the Blender bottle (multiply for tint and shadow, screen for highlights), the white mist on top */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* panel */
#panel{position:absolute;left:50%;bottom:0;z-index:5;width:min(980px,94vw);opacity:0;pointer-events:none;
  transform:translate(-50%,100%);background:rgba(255,250,240,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-radius:0;box-shadow:0 -10px 40px rgba(29,42,51,.10);
  padding:26px 34px 84px;display:grid;grid-template-columns:1fr 1.15fr;column-gap:40px;align-items:start}
#panel.on{pointer-events:auto}
.num{font-family:var(--label);font-weight:400;font-size:12px;letter-spacing:.3em;color:var(--blue);text-transform:uppercase}
.name{font-family:var(--serif);font-weight:300;font-size:clamp(30px,4.4svh,46px);color:var(--blue);line-height:1.05;margin-top:8px}
.desc{font-size:14.5px;line-height:1.6;color:var(--ink);margin-top:12px}
.order{margin-top:14px;font:500 12px var(--label);letter-spacing:.25em;text-transform:uppercase;padding:12px 26px;
  border-radius:0;   /* square (TJ, 15 Nov) */border:1px solid var(--blue);background:var(--blue);color:var(--cream);cursor:pointer}
.order:hover{background:var(--flame);border-color:var(--flame)}
#groups{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:4px;grid-column:2;grid-row:1 / span 2}
.grp h5{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--blue);font-weight:500;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:7px;width:100%;border:0;background:rgba(242,234,207,.9);border-radius:0;
  padding:5px 10px 5px 5px;margin-bottom:6px;font:13px var(--sans);color:var(--ink);cursor:pointer;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{flex:0 0 15px;height:15px;border-radius:50%}
.chip:hover{background:#fff}
.chip:focus-visible,.order:focus-visible{outline:2px solid var(--flame);outline-offset:3px}

/* card */
#card{position:fixed;z-index:20;width:240px;background:#fffaf0;border-radius:0;padding:18px 18px 16px;
  box-shadow:0 18px 40px rgba(17,107,158,.18);display:none}
#card.show{display:block}
#card h4{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--blue)}
#card .tier{font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-top:4px}
#card p{font-size:13px;line-height:1.5;margin-top:10px;color:#4c5862}
#card button{position:absolute;top:10px;right:12px;background:none;border:0;font-size:20px;color:#7a858e;cursor:pointer}
#scrim{display:none}

/* pill */
#pill{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:6px;padding:6px;border-radius:0;background:rgba(17,107,158,.94);
  color:var(--cream);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);white-space:nowrap}
#pill .cur{padding:0 12px 0 10px;font-family:var(--serif);font-weight:300;font-size:15px;min-width:128px;text-align:center}
#pill button{border:0;background:transparent;color:var(--cream);font:500 12px var(--label);width:34px;height:30px;border-radius:0;cursor:pointer;letter-spacing:.05em}
#pill button.active{background:var(--cream);color:var(--blue)}

/* mobile */
@media (max-width:700px){
  #hero img{height:49.7svh;top:-2.2svh}
  #panel{width:100%;grid-template-columns:1fr;padding:16px 16px 72px;border-radius:0}
  .num{font-size:10px}
  .name{font-size:28px;margin-top:4px}
  .desc{font-size:13px;line-height:1.45;margin-top:8px}
  .order{margin-top:8px;padding:9px 20px;font-size:11px}
  #groups{gap:6px;margin-top:10px;grid-column:1;grid-row:2}
  #panel .pdesc{grid-row:3}
  .grp h5{margin-bottom:5px;text-align:center}
  .chip{font-size:12px;padding:4px 8px 4px 4px;margin-bottom:4px;gap:6px}
  .chip i{flex-basis:13px;height:13px}
  #card{position:fixed;left:0;right:0;bottom:0;width:auto;z-index:40;border-radius:0;padding:22px 22px 34px;
    transform:translateY(100%);transition:transform .35s ease;display:block;visibility:hidden}
  #card.show{transform:translateY(0);visibility:visible}
  #scrim{display:block;position:fixed;inset:0;background:rgba(29,42,51,.18);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
  #scrim.show{opacity:1;pointer-events:auto}
  #pill .cur{min-width:100px;font-size:14px;padding:0 8px}
}
/* pattern button: the label band in white, sitting in the scene; pressing it unfolds the band into the border of a pop-up */
/* the button is a small version of the pop-up (TJ, 15 Nov): frosted glass, the same thin cream border with a ring on each
   corner, the motif in the centre, the words above and below in the pop-up's blue */
#seal{position:absolute;left:0;top:0;z-index:4;border:1px solid rgba(252,248,234,.95);padding:14px 22px 12px;cursor:pointer;color:var(--blue);opacity:0;
  pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:9px;transition:opacity .25s,transform .25s;
  background:rgba(255,248,232,.46);-webkit-backdrop-filter:blur(10px) saturate(1.08);backdrop-filter:blur(10px) saturate(1.08);
  box-shadow:0 8px 26px rgba(60,40,10,.16)}
#seal .rg{position:absolute;width:7px;height:7px;border:1px solid rgba(252,248,234,.95);border-radius:50%;background:transparent}
#seal .r1{left:-4px;top:-4px} #seal .r2{right:-4px;top:-4px} #seal .r3{left:-4px;bottom:-4px} #seal .r4{right:-4px;bottom:-4px}
#seal span{text-shadow:none !important;font-family:var(--label) !important;font-weight:500 !important}
/* TJ's final try (15 Nov): the same pale glass as the full pop-up, motif and words in the pop-up's dark grey text colour;
   the pop-up blue on hover or press */
#seal{color:var(--ink);transition:opacity .25s,color .2s,background .2s;background:rgba(255,248,232,.42);
  -webkit-backdrop-filter:blur(16px) saturate(1.08);backdrop-filter:blur(16px) saturate(1.08)}
#seal:hover,#seal:active,#seal:focus-visible{color:var(--blue);background:rgba(255,248,232,.6)}
#seal:hover span,#seal:active span{text-shadow:none !important}
#seal svg{display:block;width:112px;height:auto;overflow:visible;animation:sealPulse 3.6s ease-in-out infinite}
#seal span{font:400 9.5px var(--sans);letter-spacing:.34em;text-transform:uppercase;white-space:nowrap;padding-left:.34em;
  text-shadow:0 1px 6px rgba(80,60,20,.45)}
#seal b{font-weight:400}
#seal .mb{display:none}             /* "Click to" on computers, "Tap to" on phone sized screens (same 700 px switch as the rest of the page) */
#seal:hover svg{animation-play-state:paused;opacity:1}
#seal:focus-visible{outline:1px solid #fff;outline-offset:4px}
@keyframes sealPulse{0%,100%{opacity:.62}50%{opacity:1}}
#popShade{position:fixed;inset:0;z-index:31;display:none;background:rgba(29,42,51,0)}
#bloom{position:fixed;inset:0;width:100%;height:100%;z-index:33;pointer-events:none;display:none;color:#FCF8EA;opacity:.9;overflow:visible}   /* the hue of the frosted blend name */
#veil{position:fixed;z-index:32;display:none;opacity:0;background:rgba(255,248,232,.42);
  -webkit-backdrop-filter:blur(16px) saturate(1.08);backdrop-filter:blur(16px) saturate(1.08)}
#popX{position:absolute;top:14px;right:18px;z-index:2;border:0;background:none;color:var(--blue);font-size:28px;line-height:1;cursor:pointer}
/* pop-up content: what used to sit in the bottom panel */
#veil .pin{position:absolute;inset:0;overflow:auto;padding:clamp(28px,5vh,60px) clamp(28px,5vw,96px)}
#veil .name{font-size:clamp(34px,5.4vh,58px)}
#veil .desc{font-size:15px;max-width:44ch}
/* note pictures: they grow up from the bottom line before the glass appears. Top notes left, heart middle, base right */
/* cut-out plants stand on the bottom line; the line is a hard edge (the row ends exactly there), petals may reach past the sides */
#noteRow{position:fixed;left:0;top:0;width:100%;z-index:34;display:none;overflow:hidden;pointer-events:none}
#noteRow .nt{position:absolute;bottom:0;border:0;background:none;padding:0;cursor:pointer;transform-origin:50% 100%;pointer-events:auto}
#noteRow canvas{display:block;filter:drop-shadow(0 10px 18px rgba(60,40,10,.18))}
/* specimen tags: a small cream card per note, placed by hand for each picture, joined to it by a hairline and a dot */
#noteRow .tag{position:absolute;transform:translate(-50%,-50%);background:rgba(255,251,242,.95);border:1px solid rgba(17,107,158,.18);
  box-shadow:0 4px 14px rgba(60,40,10,.14);padding:5px 11px 4px;text-align:center;white-space:nowrap;pointer-events:none;z-index:2}
#noteRow .tag b{display:block;font:500 11px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
#noteRow .tag i{display:block;font:400 8.5px var(--label);letter-spacing:.26em;text-transform:uppercase;color:#8a7a55;font-style:normal;margin-top:2px}
#noteRow .hl{position:absolute;height:1px;background:rgba(17,107,158,.5);transform-origin:0 50%;pointer-events:none;z-index:1}
#noteRow .hd{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%);z-index:1}
#card{z-index:45}
/* the bottle, lifted out of the scene and set in the pop-up in front of the glass */
#btop{position:fixed;inset:0;width:100%;height:100%;z-index:34;pointer-events:none;display:none}   /* above the glass and frame, behind the notes */
#noteRow{z-index:35 !important}
#veil .pin{overscroll-behavior:contain}
@media (max-width:700px){ #seal svg{width:92px} #seal span{font-size:9px} #seal .dk{display:none} #seal .mb{display:inline}
  #veil .pin{padding:40px 18px 20px}
  #veil .name{font-size:30px} #veil .desc{font-size:13.5px}
  #noteRow .tag{padding:3px 7px 2px} #noteRow .tag b{font-size:9.5px;letter-spacing:.12em} #noteRow .tag i{font-size:7.5px}
  #veil .pleft{max-width:52%} }   /* phones: the notes take the right half, the text the left */
@media (prefers-reduced-motion:reduce){
  #card{transition:none !important}
  #seal svg{animation:none;opacity:.85}
}
</style>
</head>

      <div class="phead"><div class="num" id="num"></div><h2 class="name" id="name"></h2></div>

// Every scene is three layers, back to front: sky, the blend name as flat frosted glass, then the foreground.
// The glass has no colour of its own: inside the letters sits a blurred, slightly lifted copy of the sky,
// lined up with the sky behind it, plus a faint white sheen. TJ's settings (13 Nov 2026):
// Visibility 78, Frost 60, Lightness 38, Parallax 67.
var GLASS={op:0.78, blur:0.60*18, bright:1+0.38*0.25, white:0.38*0.35, par:0.67};
var DEPTH={sky:0.15, word:0.4, fg:1};          // the sky barely moves, the name a little, the people and land most
var NAMEBOX={x:0.17, y:0.09, w:0.66};          // where the name sits, as a share of the scene image (left, top, width)
var SPARE=1.08;                                // scene image covers the screen with a little spare edge for the movement
var FILTER_OK=(function(){ try{ var t=mk(1,1).getContext("2d"); t.filter="blur(2px)"; return t.filter==="blur(2px)"; }catch(e){ return false; } })();
var PS=BL.map(function(){return null});        // prepared layers per blend
function shapeNow(){ return W/H<0.9 ? "tall" : "wide"; }
function frostCopy(src,w,h){                   // the sky as seen through the glass: blurred, lifted, a touch richer, milky sheen
  var g=mk(Math.max(1,Math.round(w)),Math.max(1,Math.round(h))), c=g.getContext("2d");
  if(FILTER_OK){
    c.filter="blur("+GLASS.blur.toFixed(1)+"px) brightness("+GLASS.bright.toFixed(3)+") saturate(1.1)";
    c.drawImage(src,0,0,g.width,g.height); c.filter="none";
  } else {                                    // older Safari: blur by shrinking and enlarging, lift by adding light
    var f=Math.max(2,GLASS.blur/2), sm=mk(Math.max(1,Math.round(w/f)),Math.max(1,Math.round(h/f))), sc=sm.getContext("2d");
    sc.imageSmoothingQuality="high"; sc.drawImage(src,0,0,sm.width,sm.height);
    c.imageSmoothingQuality="high"; c.drawImage(sm,0,0,g.width,g.height);
    c.globalCompositeOperation="lighter"; c.globalAlpha=GLASS.bright-1; c.drawImage(g,0,0);
    c.globalCompositeOperation="source-over"; c.globalAlpha=1;
  }
  c.fillStyle="rgba(255,255,255,"+GLASS.white.toFixed(3)+")"; c.fillRect(0,0,g.width,g.height);
  return g;
}
function namePath(j,pw){                       // the blend name outlines from TJ's Enziwa font, scaled to this scene size
  var wd=WORDS[BL[j].name.toUpperCase()], lw=NAMEBOX.w*pw, k=lw/wd.w;
  return new Path2D(wd.d.replace(/-?\d+(\.\d+)?/g,function(n){return (n*k).toFixed(2)}));
}
function buildScene(j){
  var b=BL[j], shape=shapeNow(), ps;
  if(b.layers){                                // photographic scene in layers
    var s=b.layers[shape], li=layerImgs(j,shape);
    if(!(ok(li.sky)&&ok(li.fg))){ PS[j]=null; drawFlat(j); return; }
    var pw=W*SPARE, ph=pw*s.h/s.w; if(ph<H*SPARE){ ph=H*SPARE; pw=ph*s.w/s.h; }
    ps={w:pw,h:ph,sky:li.sky,fg:li.fg};
  } else {                                     // placeholder colour scene: gradient sky, grey figures in front
    var ar=shape==="tall"?1536/2752:2752/1536, pw2=W*SPARE, ph2=pw2/ar; if(ph2<H*SPARE){ ph2=H*SPARE; pw2=ph2*ar; }
    ps={w:pw2,h:ph2}; var ox=(pw2-W)/2, oy=(ph2-H)/2;

    c2.drawImage(NG(tl.n,tl.cv.width,tl.cv.height,time,RM?0:tx*2,RM?0:ty*2,k*1.7,kind.rest?0:1),0,0);
  });
}
function bandAt(x,y,k){ return "translate("+x.toFixed(2)+","+y.toFixed(2)+") scale("+k.toFixed(4)+") translate("+(-BCX)+","+(-BCY)+")"; }
function ln(n,x1,y1,x2,y2,w){ var e=$("ln"+n); e.setAttribute("x1",x1.toFixed(2)); e.setAttribute("y1",y1.toFixed(2)); e.setAttribute("x2",x2.toFixed(2)); e.setAttribute("y2",y2.toFixed(2)); e.setAttribute("stroke-width",w.toFixed(2)); e.style.opacity=Math.abs(x2-x1)+Math.abs(y2-y1)>0.5?1:0; }
function drawBloom(t){
  pop.drawn=t+"|"+W+"|"+H;
  var on=t>0.0005; bloom.style.display=on?"block":"none"; veil.style.display=on?"block":"none"; shade.style.display=pop.goal?"block":"none";
  if(!on||!pop.s0) return;
  var R=popRect(), s0=pop.s0, k1=Math.max(150,Math.min(260,R.w*0.3))/(2*BHALF), sw;
  var a=ease(rng(t,0,0.42)), b=ease(rng(t,0.32,0.75)), c=ease(rng(t,0.6,0.95)), v=ease(rng(t,0.86,1));   // glass last, after the notes have grown
  var k=s0.k+(k1-s0.k)*a, xc=s0.x+(R.x+R.w/2-s0.x)*a, yT=s0.y+(R.y-s0.y)*a, yB=s0.y+(R.y+R.h-s0.y)*a, e=BHALF*k, mid=R.y+R.h/2;
  sw=0.25*k;
  // the motif travels only to the bottom edge (TJ, 14 Nov); the top edge is a clean line that draws out from the middle
  $("bTop").style.display="none"; $("bBot").setAttribute("transform",bandAt(xc,yB,k));
  ln(0,xc,yT,xc-(xc-R.x)*b,yT,sw); ln(1,xc,yT,xc+(R.x+R.w-xc)*b,yT,sw);
  ln(2,xc-e,yB,xc-e-(xc-e-R.x)*b,yB,sw); ln(3,xc+e,yB,xc+e+(R.x+R.w-xc-e)*b,yB,sw);
  ln(4,R.x,yT,R.x,yT+(mid-yT)*c,sw); ln(5,R.x,yB,R.x,yB-(yB-mid)*c,sw);
  ln(6,R.x+R.w,yT,R.x+R.w,yT+(mid-yT)*c,sw); ln(7,R.x+R.w,yB,R.x+R.w,yB-(yB-mid)*c,sw);
  [[R.x,yT],[R.x+R.w,yT],[R.x,yB],[R.x+R.w,yB]].forEach(function(q,n){   // a ring settles on each corner, like the end rings of the band
    var g=$("rg"+n); g.setAttribute("cx",q[0].toFixed(2)); g.setAttribute("cy",q[1].toFixed(2));
    g.setAttribute("r",(0.57*k*ease(rng(t,0.7,1))).toFixed(2)); g.setAttribute("stroke-width",sw.toFixed(2));
  });
  veil.style.left=R.x+"px"; veil.style.top=R.y+"px"; veil.style.width=R.w+"px"; veil.style.height=R.h+"px"; veil.style.opacity=v.toFixed(3);
  veil.style.pointerEvents=v>0.5?"auto":"none";
}
function openPop(e){
  if(e) e.stopPropagation();
  var r=seal.querySelector("svg").getBoundingClientRect();   // start exactly on the button's band
  pop.s0={x:r.left+r.width*(BCX-7.05)/25.65, y:r.top+r.height*(BCY-11.1)/6.45, k:r.width/25.65};
  pop.i=sealJ; fillPop(sealJ); pop.goal=1; key="";
}
function closePop(){ pop.goal=0; }
// The bottle joins the pop-up: it leaves the scene, puts its cap on as it travels (from wherever the cap was: off, lifting,
// going back on, or already on mid spin), and settles at the far right above vetiver and musk, its cap rising out of the top
// edge of the frame, clear of the blend name and the close button. Closing plays it all back, cap included.
var btop=$("btop"), bctx=btop.getContext("2d"), bNow={set:"d",j:SQ.down-1,pre:"b"}, bDrawn="";
// frame units (frames are 854 x 480): glass width, top of the CLOSED cap, cap height, base
var BW=150, CTOP=146, CAPH=96, BH=SQ.base-146, CAPHALF=48, BODYHALF=75;
// TJ, 15 Nov: big, at the far right, about 60% of the cap rising over the top edge, the base sinking behind the plants
// (vetiver overlaps it); drawn behind the notes and tags. The cap stays clear of the blend name and the close button.
function bottleTarget(){
  var R=popRect(), mob=mq.matches, ceil=R.y+R.h-(mob?Math.min(R.h*0.34,260):Math.min(R.h*0.5,400)), s2, yt, xc;
  if(mob){   // phone: standing on the bottom line, centred halfway between the left edge and the motif; as large as TJ asked
             // (double) but never over the text or the Order button, and only a little past the left border
    xc=R.x+R.w*0.25;
    var ob=document.querySelector("#veil .order").getBoundingClientRect(), obB=ob.height?ob.bottom:R.y+R.h*0.45;
    s2=Math.min(2*Math.min(R.h*0.42,280)/BH, (R.y+R.h-4-(obB+10))/BH, (xc-(R.x-24))/BODYHALF);
    yt=R.y+R.h-4-BH*s2; }
  else {
    s2=Math.min(1.9,0.62*R.h/(BH-0.6*CAPH));
    var ps=PS[pop.i], wr=ps?(W-ps.w)/2+(NAMEBOX.x+NAMEBOX.w)*ps.w+16:-1e9;
    s2=Math.min(s2,(R.x+R.w+10-wr)/(CAPHALF+BODYHALF));             // room between the name and the right edge
    xc=R.x+R.w-40-BODYHALF*s2; if(xc-CAPHALF*s2<wr) xc=wr+CAPHALF*s2;
    yt=R.y-0.6*CAPH*s2;
    if(s2<0.7){ s2=Math.min(1,(ceil-R.y)/BH); yt=R.y+12; xc=R.x+R.w-62-BODYHALF*s2; }   // no room beside the name: inside the frame
  }
  return [xc-SQ.cx*s2, yt-CTOP*s2, SQ.w*s2, SQ.h*s2];
}
function drawBottleTop(t){
  var on=t>0.0005, k2=on?[t.toFixed(4),W,H,bNow.set,bNow.j,tx.toFixed(3),ty.toFixed(3)].join("|"):"off";
  if(k2===bDrawn) return; bDrawn=k2;
  btop.style.display=on?"block":"none"; if(!on) return;
  if(btop.width!==Math.round(W*dpr)){ btop.width=Math.round(W*dpr); btop.height=Math.round(H*dpr); }
  bctx.setTransform(dpr,0,0,dpr,0,0); bctx.clearRect(0,0,W,H);
  var m=ease(rng(t,0,0.55)), cap=ease(rng(t,0,0.42)), A=frameRect(1), B=bottleTarget();
  var r=A.map(function(v,n){return v+(B[n]-v)*m}), BS=bset(bNow.pre), D=SQ.down-1, d0;
  if(bNow.set==="l") d0=(1-bNow.j/(SQ.lift-1))*D; else if(bNow.set==="d") d0=bNow.j; else d0=D;   // cap position when it left the scene
  bctx.imageSmoothingEnabled=true; bctx.imageSmoothingQuality="high";
  if(bNow.set==="s"||bNow.set==="o"){                                 // mid spin: cross from the turning frame to the front, cap on
    var sf=pick(BS[bNow.set],bNow.j); if(sf){ bctx.globalAlpha=1-cap; bctx.drawImage(sf,r[0],r[1],r[2],r[3]); }
    bctx.globalAlpha=cap;
  }
  var im=pick(BS.d,Math.round(d0+(D-d0)*cap)); if(im) bctx.drawImage(im,r[0],r[1],r[2],r[3]);
  bctx.globalAlpha=1;
}
// while the pop-up is open the page stays on this blend: no wheel, swipe or key scrolling outside the pop-up itself
window.addEventListener("wheel",function(e){ if(pop.goal===1 && !(e.target.closest && e.target.closest("#veil .pin"))) e.preventDefault(); },{passive:false});
window.addEventListener("touchmove",function(e){ if(pop.goal===1 && !(e.target.closest && e.target.closest("#veil .pin"))) e.preventDefault(); },{passive:false});
window.addEventListener("keydown",function(e){ if(pop.goal===1 && [" ","PageDown","PageUp","ArrowDown","ArrowUp","Home","End"].indexOf(e.key)>=0) e.preventDefault(); });
seal.addEventListener("click",openPop);
$("popX").onclick=function(e){e.stopPropagation(); closePop();};
shade.onclick=closePop; veil.onclick=function(e){e.stopPropagation(); closeCard();};
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closePop(); });

// helpers
function cl(x){return x<0?0:x>1?1:x}
function rng(t,a,b){return cl((t-a)/(b-a))}
function ease(x){return x*x*(3-2*x)}
function toward(v,goal,maxStep){return v<goal?Math.min(goal,v+maxStep):Math.max(goal,v-maxStep)}

// scroll
var cur=window.scrollY/H||0, tgt=cur, jumpTo=null;
function onScroll(){tgt=window.scrollY/H}
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",function(){size();onScroll()});
mq.addEventListener && mq.addEventListener("change",function(){closeCard()});

// the pill lands in that blend's revealed scene: blends passed on the way count as already sprayed
pillBtns.forEach(function(btn){btn.onclick=function(e){e.stopPropagation(); if(typeof closePop==="function") closePop();
  var i=+btn.dataset.i; jumpTo=START+SEG*i+SEG*0.8;
  window.scrollTo({top:jumpTo*H,behavior:RM?"auto":"smooth"});}});

// spray event state, per blend: idle, play, done, fade
var sp={i:-1,state:"idle",p:0,fade:0};
var capShown=0, liftShown=0, outShown=0, panelGate=0, lastTime=0, lastI=-2, key="", sv=0;
function setDone(){ sp.state="done"; sp.p=1; capShown=1; liftShown=1; panelGate=1; }

// drawing
function frameRect(e){ // frame rect in stage px, scaled by e around the nozzle
  var w=SQ.w*L.s, h=SQ.h*L.s, px=L.x+SQ.cx*L.s, py=L.y+L.lift+SQ.nozY*L.s;
  return [px-(px-L.x)*e, py-(py-(L.y+L.lift))*e, w*e, h*e];
}
function drawBottle(kind,j,alpha,under,mixTo,mix){ // soft contact shadow, then the see-through bottle frame drawn normally
  // under: the blend whose scene is behind the bottle (-1 is cream); mixTo/mix crossfade to another blend's lit frames during a reveal
  var b=pick(bset(preFor(under))[kind],j), r=frameRect(1);
  if(!b||alpha<=0.001) return;
  fc.globalAlpha=alpha;
  var hv=BL[shown]&&BL[shown].hover, cx=L.x+SQ.cx*L.s, cy=L.y+L.lift+(SQ.base-2)*L.s+(hv?H*0.12:0), rw=(hv?150:110)*L.s;
  fc.save(); fc.translate(cx,cy); fc.scale(1,0.16);
  var g=fc.createRadialGradient(0,0,0,0,0,rw); g.addColorStop(0,hv?"rgba(40,30,10,.22)":"rgba(0,0,0,.30)"); g.addColorStop(1,"rgba(0,0,0,0)");
  fc.fillStyle=g; fc.beginPath(); fc.arc(0,0,rw,0,6.2832); fc.fill(); fc.restore();
  fc.imageSmoothingEnabled=true; fc.imageSmoothingQuality="high";   // clean, crisp downscale of the large frames
  var b2=mix>0.001 && preFor(mixTo)!==preFor(under) ? pick(bset(preFor(mixTo))[kind],j) : null;
  if(b2 && mix>=0.999) b=b2, b2=null;
  fc.drawImage(b,r[0],r[1],r[2],r[3]);
  if(b2){ fc.globalAlpha=alpha*mix; fc.drawImage(b2,r[0],r[1],r[2],r[3]); }
  fc.globalAlpha=1;
}
var MIST_MAX=0.8;   // overall strength of the white mist: a veil over the colour, not a sheet
function grow(p){return 1+1.6*ease(rng(p,0.45,0.85))}   // the reveal finishes a little sooner now the mist leaves earlier
function fill(p){return ease(rng(p,0.55,0.85))}
function drawBase(i){ if(i>0) fc.drawImage(SC[i-1],0,0,W,H); else { fc.fillStyle=CREAM; fc.fillRect(0,0,W,H); } }
function drawReveal(i,p){
  var mi=pick(MASK[i],Math.round(p*(SQ.mask-1))); if(!mi) return;
  var E=grow(p), g=fill(p), r=frameRect(MS), re=frameRect(E*MS);
  mc.clearRect(0,0,W,H);
  // masks carry half a clip height of soft margin above and below, so the reveal feathers past the clip edge
  mc.drawImage(mi,r[0],r[1]-r[3]*0.5,r[2],r[3]*2);
  if(E>1.001) mc.drawImage(mi,re[0],re[1]-re[3]*0.5,re[2],re[3]*2);
  if(g>0){ mc.fillStyle="rgba(0,0,0,"+g+")"; mc.fillRect(0,0,W,H); }
  ssx.globalCompositeOperation="copy"; ssx.drawImage(SC[i],0,0,W,H);
  ssx.globalCompositeOperation="destination-in"; ssx.drawImage(M,0,0);
  ssx.globalCompositeOperation="source-over";
  fc.drawImage(SS,0,0,W,H);
}
function drawMistLayer(i,p){
  var wi=pick(MIST[i],Math.round(p*(SQ.mist-1))); if(!wi) return;
  // full only through the soft rolling cloud; as the clip breaks into thin streaks (about 40% in) the mist fades to a faint veil, then away
  var r=frameRect(MS), a=MIST_MAX*(1-0.8*ease(rng(p,0.38,0.58)))*(1-ease(rng(p,0.58,0.80)));
  if(a<=0.001) return;

  fc.drawImage(wi,r[0],r[1],r[2],r[3]);
  fc.globalCompositeOperation="source-over"; fc.globalAlpha=1;
}

function frame(time){
  var dt=lastTime?Math.min(0.1,(time-lastTime)/1000):0; lastTime=time;
  cur = RM ? tgt : cur+(tgt-cur)*0.12;
  if(Math.abs(tgt-cur)<0.0005) cur=tgt;
  var p=cur;
  if(jumpTo!==null && Math.abs(window.scrollY/H-jumpTo)<0.01 && Math.abs(cur-tgt)<0.01) jumpTo=null;

  // opening
  var h=1-ease(rng(p,0.35,0.95));
  hero.style.opacity=h; hero.style.visibility=h<=0.001?"hidden":"visible";
  hero.style.transform="translateY("+(-(1-h)*6)+"svh)";

  var i=Math.max(0,Math.min(BL.length-1,Math.floor((p-START)/SEG)));
  var t=(p-START-SEG*i)/SEG; if(p<START) t=(p-START)/SEG; // negative before blend one
  if(i!==shown) build(i);
  if(p<0.5){pillCur.textContent="ENZIWA";pillBtns.forEach(function(x){x.classList.remove("active")});lastI=-1}
  else if(lastI!==i){pillCur.textContent=BL[i].name;pillBtns.forEach(function(x,j){x.classList.toggle("active",j===i)});lastI=i}

  // spray event: forward only, in real time
  if(sp.i!==i){
    sp={i:i,state:"idle",p:0,fade:0}; capShown=0; liftShown=0; outShown=0; panelGate=0;
    if(t>T.cap1) setDone();      // coming back up from the next blend: already revealed, no replay
  }
  if(jumpTo!==null && t>=T.press && sp.state!=="done") setDone();
  var past=t>=T.press;
  if(past && (sp.state==="idle"||sp.state==="fade")){ sp.state="play"; sp.p=0; }
  if(!past && (sp.state==="play"||sp.state==="done")){
    sp.state="fade"; sp.fade=1; fzx.drawImage(fx,0,0);   // freeze what is on screen and fade it in place
  }
  if(sp.state==="play"){
    sp.p+=RM?1:dt/SPRAY_S*(t>=T.cap0?FAST:1);
    if(window.__freezeP!=null) sp.p=window.__freezeP;   // test hook: hold the spray at a set point
    if(sp.p>=1){ sp.p=1; sp.state="done"; }
  } else if(sp.state==="fade"){
    sp.fade-=dt/FADE_S; if(sp.fade<=0){ sp.fade=0; sp.state="idle"; sp.p=0; }
  }

  // bottle: spin in by scroll, cap lift by scroll (held up while spraying or fading back),
  // cap back on and spin out by scroll but only once the spray has finished
  var liftGoal=(sp.state!=="idle")?1:rng(t,T.ho1,T.press);
  liftShown = RM ? liftGoal : toward(liftShown,liftGoal,dt/0.4);
  var capGoal=sp.state==="done"?ease(rng(t,T.cap0,T.cap1)):0;
  capShown = RM ? capGoal : toward(capShown,capGoal,dt/0.6);
  var outGoal=capShown>=0.999?rng(t,T.out0,1):0;
  outShown = RM ? outGoal : toward(outShown,outGoal,dt/0.5);
  panelGate = RM ? (capShown>=0.999?1:0) : toward(panelGate,capShown>=0.999?1:0,dt/0.35);
  var bottleA = i===0 ? ease(rng(t,0,0.05)) : 1;

  // panel, and on mobile lift the bottle if the panel would cover it
  var pa=ease(rng(t,T.panel0,T.panel1))*panelGate*(1-ease(rng(t,T.pout0,T.pout1)));
  if(BL[i].seal) pa=0;   // blends with the pattern button keep their details in its pop-up, not the bottom panel
  var bottleBase=L.y+SQ.base*L.s+14, ptop=H-panel.offsetHeight;
  L.lift=Math.min(0,ptop-12-bottleBase)*pa;
  panel.style.opacity=pa; panel.classList.toggle("on",pa>0.6);
  panel.style.transform="translate(-50%,"+((1-pa)*100)+"%)";
  if(card.classList.contains("show") && pa<0.6) closeCard();

  // pattern button and its pop-up
  // the button belongs to its scene: it fades in as the spray reveals the scene and fades out as the next scene covers it
  var rv=ease(rng(sp.p,0.25,0.75)), sj, sa;
  if(sp.state==="done"){ sj=i; sa=1; }
  else if(sp.state==="play"){ if(rv>=0.5){ sj=i; sa=(rv-0.5)*2; } else { sj=i-1; sa=1-rv*2; } }
  else { sj=i-1; sa=1; }                         // idle or fading back: the previous scene is still behind the bottle
  if(pop.goal===1 && sj!==pop.i) closePop();
  placeSeal(sj,p,sa);
  if(pop.t!==pop.goal || pop.t>0 || pop.drawn!==pop.t+"|"+W+"|"+H){   // redrawn every frame while open, to follow the name
    pop.t = RM ? pop.goal : toward(pop.t,pop.goal,dt/(pop.goal?2.0:1.0));
    drawBloom(pop.t); drawTiles(pop.t,time/1000);
  }

  // scene layers: ease the pointer, then redraw this scene (and the one under the reveal) if its layers moved
  tx+=(mx-tx)*.08; ty+=(my-ty)*.08;
  if(composeScene(i,p)) sv++;
  if(i>0 && composeScene(i-1,p)) sv++;

  // composite
  var hb=pop.t>0.0005?0:1;   // while the pop-up is open the bottle is drawn in front of the glass instead (drawBottleTop)
  var k=[sv,i,sp.state,Math.round(sp.p*600),Math.round(sp.fade*60),Math.round(t*3000),Math.round(capShown*100),Math.round(liftShown*100),Math.round(outShown*100),Math.round(L.lift),W,H,hb].join("|");
  if(k!==key){ key=k;
    fc.setTransform(dpr,0,0,dpr,0,0); fc.globalAlpha=1; fc.globalCompositeOperation="source-over";
    var set, j;
    if(t<T.spin1){ set="s"; j=Math.round(rng(t,0,T.spin1)*(SQ.spin-1)); }
    else if(sp.state==="done" && outShown>0){ set="o"; j=Math.round(outShown*(SQ.out-1)); }
    else if(sp.state==="done" && capShown>0){ set="d"; j=Math.round(capShown*(SQ.down-1)); }
    else { set="l"; j=Math.round(liftShown*(SQ.lift-1)); }
    if(pop.t<=0.0005){ bNow={set:set,j:j,pre:preFor(sp.state==="done"?i:i-1)}; }   // where the bottle is in the scene when the pop-up opens
    // the bottle wears the light of the scene behind it: the previous scene (or cream) until this one is revealed
    if(sp.state==="fade"){
      drawBase(i); drawBottle(set,j,bottleA*hb,i-1);
      fc.setTransform(1,0,0,1,0,0); fc.globalAlpha=sp.fade; fc.drawImage(FZ,0,0); fc.globalAlpha=1;
    } else if(sp.state==="play"){
      drawBase(i); drawReveal(i,sp.p); drawBottle(set,j,hb,i-1,i,ease(rng(sp.p,0.25,0.6))); drawMistLayer(i,sp.p);
    } else if(sp.state==="done"){
      fc.drawImage(SC[i],0,0,W,H); drawBottle(set,j,hb,i);
    } else {
      drawBase(i); drawBottle(set,j,bottleA*hb,i-1);
    }
  }
  drawBottleTop(pop.t);

  requestAnimationFrame(frame);
}
size(); onScroll(); cur=tgt; build(0); requestAnimationFrame(frame);
window.__setScroll=function(v){window.scrollTo(0,v*H);tgt=cur=v};
window.__spray=function(){return {i:sp.i,state:sp.state,p:+sp.p.toFixed(2),cap:+capShown.toFixed(2),out:+outShown.toFixed(2)}};
})();
